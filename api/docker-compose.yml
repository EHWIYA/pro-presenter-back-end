# 로컬 개발용 (소스 build). NAS 운영은 ../ops/docker-compose.yml + GHCR pull.
services:
  pro-presenter-postgres:
    image: postgres:17-alpine
    container_name: pro-presenter-postgres-dev
    environment:
      POSTGRES_DB: pp_db
      POSTGRES_USER: pp_user
      POSTGRES_PASSWORD: pp_dev_password
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pp_user -d pp_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  pro-presenter-api:
    container_name: pro-presenter-api
    build: .
    depends_on:
      pro-presenter-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8003:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pp_user:pp_dev_password@pro-presenter-postgres:5432/pp_db
      DATA_REPO_PATH: /app/data/pro-presenter-data
    volumes:
      - ../ops/venues.json:/live/venues.json:ro
      - ./data/bible-krv.sample.json:/app/data/bible-krv.json:ro
      - ./data/fixtures/pro-presenter-data:/app/data/pro-presenter-data:ro
    restart: unless-stopped
