# NAS <repo>/ops/bin/deploy.sh 실행만 (pull·compose·health는 NAS에서 처리)
name: Deploy NAS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/ehwiya/pro-presenter-back-end
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      # Hosted runner → Tailscale 100.x SSH (docs/GHA-DEPLOY-B2.md, Secret: TS_AUTH_KEY)
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          ping: ${{ secrets.NAS_HOST }}
          version: latest
      - name: SSH deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_SSH_PORT || 22 }}
          timeout: 60s
          script_stop: true
          command_timeout: 10m
          script: |
            DEPLOY_ROOT="${{ secrets.NAS_DEPLOY_PATH || '/home/iwh/pro-presenter/api' }}"
            IMAGE="${{ env.GHCR_IMAGE }}:${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || 'main' }}"
            CANDIDATES="
            ${DEPLOY_ROOT}/ops/bin/deploy.sh
            ${DEPLOY_ROOT}/bin/deploy.sh
            /home/iwh/pro-presenter/api/ops/bin/deploy.sh
            /home/iwh/pro-presenter/live/bin/deploy.sh
            /home/iwh/pro-presenter/pro-presenter-back-end/ops/bin/deploy.sh
            "
            for script_path in ${CANDIDATES}; do
              if [ -x "${script_path}" ]; then
                echo "using deploy script: ${script_path}"
                "${script_path}" "${IMAGE}"
                exit 0
              fi
            done
            echo "deploy.sh not found. checked paths:" >&2
            for script_path in ${CANDIDATES}; do echo " - ${script_path}" >&2; done
            exit 1
